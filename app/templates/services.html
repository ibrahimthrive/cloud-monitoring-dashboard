{% extends "base.html" %}
{% block title %}Services - Cloud Monitor{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Running Services</h2>
    <span class="badge text-bg-success"><i class="bi bi-broadcast"></i> Live</span>
</div>
<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Display Name</th>
                    <th>Status</th>
                    <th>Start Type</th>
                </tr>
            </thead>
            <tbody id="serviceTableBody">
                <tr><td colspan="4" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/services.js') }}"></script>
{% endblock %}
