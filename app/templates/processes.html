{% extends "base.html" %}
{% block title %}Processes - Cloud Monitor{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Running Processes</h2>
    <span class="badge text-bg-success"><i class="bi bi-broadcast"></i> Live</span>
</div>
<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>PID</th>
                    <th>Name</th>
                    <th>User</th>
                    <th>Status</th>
                    <th>CPU %</th>
                    <th>Memory %</th>
                </tr>
            </thead>
            <tbody id="processTableBody">
                <tr><td colspan="6" class="text-center text-muted py-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    window.LIVE_REFRESH_INTERVAL_MS = {{ config.LIVE_REFRESH_INTERVAL_SECONDS * 1000 }};
</script>
<script src="{{ url_for('static', filename='js/processes.js') }}"></script>
{% endblock %}
